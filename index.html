<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a66c2">
<title>JobSwipe – Niklas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a66c2'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>J</text></svg>">
<style>
:root{--blue:#0a66c2;--blue-d:#004182;--bg:#f4f2ee;--card:#fff;--text:#191919;--muted:#666;--line:#e0dfdc;--green:#057642;--red:#cc1016;--amber:#b24020;--shadow:0 0 0 1px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;max-width:980px;margin:0 auto;padding:8px 14px}
.logo{width:34px;height:34px;border-radius:6px;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center;font-size:20px}
.brand{font-weight:700;font-size:17px}
.upd{font-size:12px;color:var(--muted)}
.sp{flex:1}
.iconbtn{border:0;background:none;padding:6px 8px;border-radius:20px;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:4px}
.iconbtn:hover{background:#eef3f8}
.iconbtn.on{color:var(--blue);font-weight:600}
nav.tabs{display:flex;max-width:980px;margin:0 auto}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
nav.tabs button.active{color:var(--text);border-bottom-color:var(--green)}
nav.tabs .cnt{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
#filters{display:none;max-width:980px;margin:0 auto;padding:6px 14px 12px;gap:8px;flex-wrap:wrap}
#filters.open{display:flex}
.chip{border:1px solid #8c8c8c;border-radius:16px;padding:4px 12px;background:#fff;color:#404040;font-size:14px;font-weight:600}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.fsel{border:1px solid #8c8c8c;border-radius:16px;padding:4px 10px;background:#fff;font-size:14px;color:#404040;max-width:100%}
.fsel input,.fsel select{border:0;font:inherit;background:none;color:inherit;outline:none}
main{max-width:980px;margin:0 auto;padding:12px 12px 120px}
/* feed */
#feed{position:relative;height:calc(100dvh - 250px);min-height:420px;max-width:560px;margin:0 auto}
.card{position:absolute;inset:0;background:var(--card);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y;user-select:none;will-change:transform;transition:transform .3s ease, opacity .3s ease}
.card.dragging{transition:none}
.card.back1{transform:scale(.96) translateY(10px);opacity:.9}
.card.back2{transform:scale(.92) translateY(20px);opacity:.7}
.cover{height:56px;background:linear-gradient(120deg,#a0b4b7,#d0dce0);position:relative;flex:none}
.cover.g1{background:linear-gradient(120deg,#0a66c2,#70b5f9)}.cover.g2{background:linear-gradient(120deg,#378fe9,#a8d1ff)}.cover.g3{background:linear-gradient(120deg,#5f9b41,#b6d7a8)}.cover.g4{background:linear-gradient(120deg,#e7a33e,#f5d49c)}.cover.g5{background:linear-gradient(120deg,#8f5849,#d8b0a2)}.cover.g6{background:linear-gradient(120deg,#666,#bbb)}
.glabel{position:absolute;right:10px;top:8px;background:rgba(255,255,255,.92);border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600;color:#333}
.avatar{width:64px;height:64px;border-radius:10px;border:3px solid #fff;display:grid;place-items:center;color:#fff;font-weight:800;font-size:28px;margin:-34px 0 0 16px;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.2);flex:none}
.cbody{padding:8px 18px 12px;overflow-y:auto;flex:1}
.ttl{font-size:20px;font-weight:700;line-height:1.25;margin:4px 0 2px}
.comp{font-size:15px}
.loc{color:var(--muted);font-size:14px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.b{font-size:12px;font-weight:600;border-radius:4px;padding:2px 8px;background:#eef3f8;color:#38434f}
.b.t-Vollzeit{background:#e6f2ea;color:var(--green)}.b.t-Praktikum{background:#fff4e0;color:#915907}.b.t-PhD{background:#f3e8fd;color:#6b2fb3}
.b.new{background:var(--blue);color:#fff}
.b.dl{background:#fdecea;color:var(--red)}.b.dlok{background:#f3f6f8;color:#38434f}
.b.remote{background:#e8f3ff;color:var(--blue-d)}
.stars{color:#e7a33e;font-size:17px;letter-spacing:1px}.stars small{color:var(--muted);font-size:13px;letter-spacing:0;margin-left:6px}
.pay{font-weight:600;color:var(--green);margin:4px 0}
.sec{margin-top:12px}.sec h4{margin:0 0 3px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.sec p{margin:0;font-size:14.5px}
.meta{font-size:12px;color:var(--muted);margin-top:14px}
.applyrow{padding:10px 18px 14px;border-top:1px solid var(--line);flex:none;display:flex;gap:8px}
.apply{flex:1;background:var(--blue);color:#fff;border:0;border-radius:24px;padding:10px 16px;font-weight:700;font-size:15px;text-align:center;text-decoration:none}
.apply:hover{background:var(--blue-d)}
.apply.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue);flex:none}
.stamp{position:absolute;top:70px;font-size:28px;font-weight:900;border:4px solid;border-radius:8px;padding:2px 12px;opacity:0;transform:rotate(-14deg);pointer-events:none;z-index:3;background:rgba(255,255,255,.85)}
.stamp.like{left:18px;color:var(--green)}.stamp.nope{right:18px;color:var(--red);transform:rotate(14deg)}
.actions{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:18px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:15}
.act{width:58px;height:58px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);font-size:24px;display:grid;place-items:center;transition:transform .12s}
.act:active{transform:scale(.9)}
.act.small{width:46px;height:46px;font-size:19px;margin-top:6px}
.act.no{color:var(--red)}.act.yes{color:var(--green)}.act.go{color:var(--blue)}.act.undo{color:#915907}
.empty{text-align:center;color:var(--muted);padding:60px 20px;background:#fff;border-radius:14px;box-shadow:var(--shadow)}
.progress{max-width:560px;margin:0 auto 8px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
/* list */
.list{background:#fff;border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.lgroup{padding:10px 16px;font-weight:700;background:#fafafa;border-bottom:1px solid var(--line);font-size:14px;}
.item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:#f9fafb}
.item .avatar{width:48px;height:48px;margin:0;border:0;font-size:20px;border-radius:6px}
.item .ttl{font-size:16px;color:var(--blue);margin:0}
.item .info{flex:1;min-width:0}
.item .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.item .side{display:flex;flex-direction:column;gap:6px}
.item .side button{border:0;background:none;font-size:18px;padding:2px 6px;border-radius:6px;color:var(--muted)}
.item .side button.on{color:var(--green)}
.item.hidden{opacity:.5}
.detail{padding:4px 16px 14px 76px;border-bottom:1px solid var(--line);background:#fcfcfc;font-size:14px}
.detail .apply{display:inline-block;margin-top:10px;flex:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none}
.toast.show{opacity:.95}
@media (min-width:760px){#feed{height:calc(100vh - 260px)}.ttl{font-size:22px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">J</div>
    <div><div class="brand">JobSwipe <span style="font-weight:400;color:var(--muted)">· Niklas</span></div><div class="upd" id="upd">lädt …</div></div>
    <div class="sp"></div>
    <button class="iconbtn" id="ftoggle" title="Filter">⚙︎ Filter</button>
  </div>
  <div id="filters">
    <button class="chip on" data-type="Vollzeit">Vollzeit</button>
    <button class="chip on" data-type="Praktikum">Praktikum</button>
    <button class="chip on" data-type="PhD/WiMi">PhD / WiMi</button>
    <label class="fsel">Region <select id="fregion"><option value="">Alle</option></select></label>
    <label class="fsel">Fit ab <select id="ffit"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="3.5">3,5</option><option value="4">4</option><option value="4.5">4,5</option><option value="5">5</option></select></label>
    <label class="fsel">Neu seit <input type="date" id="fsince"></label>
    <label class="fsel">🔍 <input type="search" id="fq" placeholder="Suche" size="10"></label>
    <button class="chip" id="freset">Zurücksetzen</button>
  </div>
  <nav class="tabs">
    <button data-tab="feed" class="active">Feed<span class="cnt" id="c-feed"></span></button>
    <button data-tab="saved">Gemerkt<span class="cnt" id="c-saved"></span></button>
    <button data-tab="all">Alle<span class="cnt" id="c-all"></span></button>
  </nav>
</header>
<main id="main"></main>
<div class="actions" id="actions">
  <button class="act small undo" id="b-undo" title="Rückgängig (Z)">↺</button>
  <button class="act no" id="b-no" title="Ausblenden (←)">✕</button>
  <button class="act yes" id="b-yes" title="Merken (→)">★</button>
  <button class="act small go" id="b-go" title="Zur Stelle (↑)">↗</button>
</div>
<div class="toast" id="toast"></div>
<script>
const LS = {get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let JOBS=[], META={}, saved=LS.get('js_saved',{}), hidden=LS.get('js_hidden',{}), hist=[], tab=LS.get('js_tab','feed');
let F=Object.assign({types:['Vollzeit','Praktikum','PhD/WiMi'],region:'',fit:3,since:'',q:''},LS.get('js_filters',{}));
let openId=null, showHidden=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date(); today.setHours(0,0,0,0);
const COLORS=['#0a66c2','#057642','#915907','#6b2fb3','#cc1016','#00797e','#5f6a7a','#b24020','#1b4f72','#8f5849'];
function color(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function initial(c){const m=(c||'?').replace(/^[^A-Za-zÄÖÜäöü0-9]+/,'');return (m[0]||'?').toUpperCase()}
function fmtD(iso){if(!iso)return'';const [y,m,d]=iso.split('-');return `${d}.${m}.${y}`}
function daysTo(iso){if(!iso)return null;const d=new Date(iso+'T00:00:00');return Math.round((d-today)/864e5)}
function isNew(j){const d=daysTo(j.added);return d!==null&&d>=-3}
function stars(f){if(f==null)return '<span class="stars"><small>Fit k. A.</small></span>';const full=Math.floor(f),half=f-full>=.5;let s='';for(let i=0;i<5;i++)s+=i<full?'★':(i===full&&half?'⯨':'☆');return `<span class="stars" title="Fit ${f}/5">${s}<small>Fit ${String(f).replace('.',',')}/5</small></span>`}
function typeCls(t){return t==='PhD/WiMi'?'PhD':t}
function badges(j){let b=[`<span class="b t-${typeCls(j.type)}">${esc(j.type)}</span>`,`<span class="b">${esc(j.region)}</span>`];
 if(j.remote)b.push('<span class="b remote">Remote möglich</span>');
 if(isNew(j))b.push('<span class="b new">Neu</span>');
 if(j.deadline){const d=daysTo(j.deadline);b.push(`<span class="b ${d<7?'dl':'dlok'}">${d<7?'⏰ ':''}Frist ${fmtD(j.deadline)}${d<=1?(d===0?' (heute)':d===1?' (morgen)':''):d<7?` (in ${d} T.)`:''}</span>`)}
 return b.join('')}
function matches(j){if(!F.types.includes(j.type))return false;if(F.region&&j.region!==F.region)return false;
 if((j.fit??0)<F.fit)return false;if(F.since&&(!j.added||j.added<F.since))return false;
 if(F.q){const q=F.q.toLowerCase();if(!(j.title+' '+j.company+' '+j.location+' '+j.why+' '+j.constraints).toLowerCase().includes(q))return false}
 return true}
const feedJobs=()=>JOBS.filter(j=>matches(j)&&!saved[j.id]&&!hidden[j.id]);
function save(){LS.set('js_saved',saved);LS.set('js_hidden',hidden);LS.set('js_filters',F);LS.set('js_tab',tab)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1400)}
function sec(h,t){return t?`<div class="sec"><h4>${h}</h4><p>${esc(t)}</p></div>`:''}
function cardHTML(j){return `<div class="cover g${j.group}"><span class="glabel">#${j.rank} · ${esc(j.group_label)}</span></div>
 <div class="avatar" style="background:${color(j.company)}">${esc(initial(j.company))}</div>
 <div class="stamp like">MERKEN</div><div class="stamp nope">WEG</div>
 <div class="cbody"><div class="ttl">${esc(j.title)}</div><div class="comp">${esc(j.company)}</div><div class="loc">${esc(j.location||j.region)}</div>
 <div class="badges">${badges(j)}</div>${stars(j.fit)}${j.pay?`<div class="pay">💶 ${esc(j.pay)}</div>`:''}
 ${sec('Warum es passt',j.why)}${sec('Details',j.notes)}${sec('Einschränkungen',j.constraints)}${sec('Visum',j.visa)}
 <div class="meta">Hinzugefügt ${fmtD(j.added)||'–'}${j.posted?` · Datum laut Anzeige: ${esc(j.posted)}`:''} · Quelle: ${esc(j.section)}</div></div>
 <div class="applyrow">${j.url?`<a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener">Zur Stelle ↗</a>`:'<span class="apply" style="background:#999">Kein Link</span>'}</div>`}
function renderCounts(){$('#c-feed').textContent=feedJobs().length;$('#c-saved').textContent=Object.keys(saved).filter(id=>JOBS.some(j=>j.id===id)).length;$('#c-all').textContent=JOBS.filter(matches).length}
function render(){document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 $('#actions').style.display=tab==='feed'?'flex':'none';renderCounts();
 if(tab==='feed')renderFeed();else renderList(tab)}
function renderFeed(){const list=feedJobs(),m=$('#main');
 const total=JOBS.filter(matches).length;
 m.innerHTML=`<div class="progress"><span>${total-list.length} von ${total} bewertet</span><span>← ausblenden · merken →</span></div><div id="feed"></div><div class="hint">Wischen oder Pfeiltasten ← → · ↑ öffnet die Stelle · Z = rückgängig</div>`;
 const feed=$('#feed');
 if(!list.length){feed.innerHTML=`<div class="empty"><div style="font-size:40px">🎉</div><h3>Alles durchgeswiped</h3><p>Keine weiteren Stellen mit diesen Filtern. Lockere die Filter oder schau unter „Gemerkt“.</p></div>`;return}
 list.slice(0,3).reverse().forEach((j,i,arr)=>{const el=document.createElement('div');const depth=arr.length-1-i;el.className='card'+(depth===1?' back1':depth===2?' back2':'');el.dataset.id=j.id;el.innerHTML=cardHTML(j);feed.appendChild(el);if(depth===0)attachDrag(el)})}
function topCard(){return document.querySelector('#feed .card:last-child')}
function decide(id,dir){const j=JOBS.find(x=>x.id===id);if(!j)return;hist.push({id,dir});
 if(dir>0){saved[id]=Date.now();toast('★ Gemerkt: '+j.company)}else{hidden[id]=Date.now();toast('Ausgeblendet')}save()}
function fly(dir){const el=topCard();if(!el||!el.dataset.id)return;el.style.transition='transform .35s ease, opacity .35s';el.style.transform=`translateX(${dir*130}vw) rotate(${dir*25}deg)`;el.style.opacity='0';decide(el.dataset.id,dir);setTimeout(render,250)}
function undo(){const h=hist.pop();if(!h){toast('Nichts zum Rückgängigmachen');return}delete saved[h.id];delete hidden[h.id];save();toast('Rückgängig');render()}
function attachDrag(el){let sx=0,sy=0,dx=0,dy=0,drag=false,locked=null;const like=el.querySelector('.like'),nope=el.querySelector('.nope');
 el.addEventListener('pointerdown',e=>{if(e.target.closest('a,button'))return;drag=true;locked=null;sx=e.clientX;sy=e.clientY;dx=dy=0;el.classList.add('dragging')});
 el.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;dy=e.clientY-sy;
  if(locked===null&&(Math.abs(dx)>8||Math.abs(dy)>8)){locked=Math.abs(dx)>Math.abs(dy)?'x':'y';if(locked==='x')el.setPointerCapture(e.pointerId)}
  if(locked!=='x')return;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;like.style.opacity=Math.max(0,Math.min(1,dx/100));nope.style.opacity=Math.max(0,Math.min(1,-dx/100))});
 const end=()=>{if(!drag)return;drag=false;el.classList.remove('dragging');if(locked==='x'&&Math.abs(dx)>100){fly(dx>0?1:-1)}else{el.style.transform='';like.style.opacity=nope.style.opacity=0}};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
function itemHTML(j){const isS=!!saved[j.id],isH=!!hidden[j.id];return `<div class="item${isH?' hidden':''}" data-id="${j.id}">
 <div class="avatar" style="background:${color(j.company)}">${esc(initial(j.company))}</div>
 <div class="info"><div class="ttl">${esc(j.title)}</div><div class="comp">${esc(j.company)}</div><div class="loc">${esc(j.location||j.region)}${j.pay?' · '+esc(j.pay):''}</div>
 <div class="row">${stars(j.fit)} ${badges(j)}</div></div>
 <div class="side"><button class="${isS?'on':''}" data-act="save" title="Merken">${isS?'★':'☆'}</button><button data-act="hide" title="${isH?'Wieder einblenden':'Ausblenden'}">${isH?'↺':'✕'}</button></div></div>
 ${openId===j.id?`<div class="detail">${sec('Warum es passt',j.why)}${sec('Details',j.notes)}${sec('Einschränkungen',j.constraints)}${sec('Visum',j.visa)}<div class="meta">Hinzugefügt ${fmtD(j.added)||'–'} · Quelle: ${esc(j.section)}</div>${j.url?`<a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener">Zur Stelle ↗</a>`:''}</div>`:''}`}
function renderList(kind){const m=$('#main');let list;
 if(kind==='saved'){list=JOBS.filter(j=>saved[j.id]).sort((a,b)=>a.rank-b.rank)}
 else{list=JOBS.filter(j=>matches(j)&&(showHidden||!hidden[j.id]))}
 let h='';
 if(kind==='all'){const nh=JOBS.filter(j=>matches(j)&&hidden[j.id]).length;h+=`<div class="progress" style="max-width:none"><span>${list.length} Stellen</span><button class="iconbtn ${showHidden?'on':''}" id="tglhidden">${showHidden?'Ausgeblendete verbergen':`Ausgeblendete zeigen (${nh})`}</button></div>`}
 else h+=`<div class="progress" style="max-width:none"><span>${list.length} gemerkte Stellen</span><button class="iconbtn" id="copysaved">📋 Liste kopieren</button></div>`;
 if(!list.length){m.innerHTML=h+`<div class="empty">${kind==='saved'?'Noch nichts gemerkt. Wische im Feed nach rechts ★':'Keine Stellen für diese Filter.'}</div>`;bindList();return}
 h+='<div class="list">';let g=null;
 for(const j of list){if(j.group!==g){g=j.group;h+=`<div class="lgroup">${esc(j.group_label)}</div>`}h+=itemHTML(j)}
 m.innerHTML=h+'</div>';bindList()}
function bindList(){const m=$('#main');
 m.querySelectorAll('.item').forEach(it=>it.addEventListener('click',e=>{const id=it.dataset.id,b=e.target.closest('button');
  if(b){e.stopPropagation();if(b.dataset.act==='save'){if(saved[id])delete saved[id];else{saved[id]=Date.now();delete hidden[id]}}else{if(hidden[id])delete hidden[id];else{hidden[id]=Date.now();delete saved[id]}}save();render();return}
  openId=openId===id?null:id;render()}));
 const t=$('#tglhidden');if(t)t.onclick=()=>{showHidden=!showHidden;render()};
 const c=$('#copysaved');if(c)c.onclick=()=>{const txt=JOBS.filter(j=>saved[j.id]).map(j=>`${j.title} – ${j.company} (${j.location}) ${j.url||''}`).join('\n');navigator.clipboard?.writeText(txt).then(()=>toast('Kopiert'),()=>toast('Kopieren nicht möglich'))}}
function syncFilterUI(){document.querySelectorAll('#filters .chip[data-type]').forEach(c=>c.classList.toggle('on',F.types.includes(c.dataset.type)));$('#fregion').value=F.region;$('#ffit').value=String(F.fit);$('#fsince').value=F.since;$('#fq').value=F.q}
function bindUI(){document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;openId=null;save();render();scrollTo(0,0)});
 $('#ftoggle').onclick=()=>{$('#filters').classList.toggle('open');$('#ftoggle').classList.toggle('on')};
 document.querySelectorAll('#filters .chip[data-type]').forEach(c=>c.onclick=()=>{const t=c.dataset.type;F.types=F.types.includes(t)?F.types.filter(x=>x!==t):[...F.types,t];syncFilterUI();save();render()});
 $('#fregion').onchange=e=>{F.region=e.target.value;save();render()};$('#ffit').onchange=e=>{F.fit=parseFloat(e.target.value);save();render()};
 $('#fsince').onchange=e=>{F.since=e.target.value;save();render()};$('#fq').oninput=e=>{F.q=e.target.value;save();render()};
 $('#freset').onclick=()=>{F={types:['Vollzeit','Praktikum','PhD/WiMi'],region:'',fit:3,since:'',q:''};syncFilterUI();save();render()};
 $('#b-no').onclick=()=>fly(-1);$('#b-yes').onclick=()=>fly(1);$('#b-undo').onclick=undo;
 $('#b-go').onclick=()=>{const el=topCard();const j=el&&JOBS.find(x=>x.id===el.dataset.id);if(j&&j.url)window.open(j.url,'_blank','noopener')};
 document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(tab!=='feed')return;
  if(e.key==='ArrowRight'){e.preventDefault();fly(1)}else if(e.key==='ArrowLeft'){e.preventDefault();fly(-1)}else if(e.key==='ArrowUp'){e.preventDefault();$('#b-go').click()}else if(e.key==='z'||e.key==='Backspace'){e.preventDefault();undo()}})}
async function load(){try{const r=await fetch('jobs.json?t='+Date.now(),{cache:'no-store'});const d=await r.json();JOBS=d.jobs;META=d.meta;
  const u=new Date(META.updated);$('#upd').textContent=`${JOBS.length} Stellen · aktualisiert ${u.toLocaleString('de-DE',{timeZone:'Europe/Berlin',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})} Uhr (Berlin)`;
  const regs=[...new Set(JOBS.map(j=>j.region))].sort();$('#fregion').innerHTML='<option value="">Alle</option>'+regs.map(r=>`<option>${esc(r)}</option>`).join('');
  syncFilterUI();render()}catch(e){$('#main').innerHTML='<div class="empty">jobs.json konnte nicht geladen werden.</div>'}}
bindUI();load();
</script>
</body>
</html>
